{% extends "base.html" %}
{% set active_page = "inbox" %}
{% block title %}受信箱 - open-karte{% endblock %}
{% block content %}
<div x-data="inboxPage()" x-init="init()" x-cloak>
  <h1 class="text-2xl font-bold mb-4">受信箱</h1>
  <p class="text-sm text-gray-600 mb-4">あなたが承認すべき申請の一覧です。</p>

  <div class="bg-white rounded-lg border border-gray-200">
    <div x-show="!rows.length && !loading" x-cloak class="px-4 py-10 text-center text-gray-500 text-sm">
      承認待ちはありません 🎉
    </div>
    <ul class="divide-y divide-gray-100">
      <template x-for="a in rows" :key="a.id">
        <li class="p-4">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-xs text-gray-500" x-text="'#' + a.id"></span>
                <span class="font-semibold" x-text="a.template_name"></span>
                <span class="text-xs px-2 py-0.5 bg-yellow-100 text-yellow-700 rounded" x-text="'承認ステップ ' + a.current_step"></span>
              </div>
              <div class="text-sm text-gray-600">
                <span class="font-medium" x-text="a.applicant_name"></span> さんから
                <span class="text-gray-400 ml-2" x-text="fmt(a.created_at)"></span>
              </div>
              <button @click="toggle(a.id)" class="text-xs text-blue-600 hover:underline mt-1"
                      x-text="open[a.id] ? '内容を隠す' : '内容を表示'"></button>
              <div x-show="open[a.id]" x-cloak class="mt-2 bg-gray-50 rounded p-3 text-sm">
                <div class="text-xs text-gray-500 mb-1">payload</div>
                <pre class="whitespace-pre-wrap break-all text-xs font-mono" x-text="JSON.stringify(details[a.id]?.payload || {}, null, 2)"></pre>
              </div>
            </div>
            <div class="flex flex-col gap-2 shrink-0">
              <button @click="approve(a)" :disabled="busy[a.id]"
                      class="bg-green-600 hover:bg-green-700 disabled:bg-green-300 text-white text-sm px-3 py-1.5 rounded">承認</button>
              <button @click="reject(a)" :disabled="busy[a.id]"
                      class="bg-red-600 hover:bg-red-700 disabled:bg-red-300 text-white text-sm px-3 py-1.5 rounded">却下</button>
            </div>
          </div>
        </li>
      </template>
    </ul>
  </div>
</div>

<script>
function inboxPage() {
  return {
    rows: [],
    open: {},
    details: {},
    busy: {},
    loading: true,
    async init() {
      if (!Auth.requireAuth()) return;
      await this.reload();
    },
    async reload() {
      this.loading = true;
      try { this.rows = await Auth.json('/applications/inbox'); }
      catch (e) { this.rows = []; }
      finally { this.loading = false; }
    },
    async toggle(id) {
      this.open[id] = !this.open[id];
      if (this.open[id] && !this.details[id]) {
        try { this.details[id] = await Auth.json('/applications/' + id); } catch {}
      }
    },
    async approve(a) {
      if (!confirm('申請 #' + a.id + ' を承認します。よろしいですか？')) return;
      const comment = prompt('コメント（任意）', '');
      this.busy[a.id] = true;
      try {
        await Auth.json('/applications/' + a.id + '/approve', { method: 'POST', body: JSON.stringify({ comment }) });
        await this.reload();
      } catch (e) {
        alert('エラー: ' + ((e.data && (e.data.detail || JSON.stringify(e.data))) || e.message));
      } finally {
        this.busy[a.id] = false;
      }
    },
    async reject(a) {
      const comment = prompt('却下理由（必須）', '');
      if (!comment) { alert('却下にはコメントが必須です'); return; }
      this.busy[a.id] = true;
      try {
        await Auth.json('/applications/' + a.id + '/reject', { method: 'POST', body: JSON.stringify({ comment }) });
        await this.reload();
      } catch (e) {
        alert('エラー: ' + ((e.data && (e.data.detail || JSON.stringify(e.data))) || e.message));
      } finally {
        this.busy[a.id] = false;
      }
    },
    fmt,
  };
}
</script>
{% endblock %}
