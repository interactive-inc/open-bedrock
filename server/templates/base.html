<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}open-karte{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <script>
    // ---- 認証ヘルパー (localStorage にトークン保存) ----
    const Auth = {
      key: 'open-karte:token',
      meKey: 'open-karte:me',
      token() { return localStorage.getItem(this.key); },
      setToken(t) { localStorage.setItem(this.key, t); },
      me() { try { return JSON.parse(localStorage.getItem(this.meKey) || 'null'); } catch { return null; } },
      setMe(m) { localStorage.setItem(this.meKey, JSON.stringify(m)); },
      clear() { localStorage.removeItem(this.key); localStorage.removeItem(this.meKey); },
      requireAuth() {
        if (!this.token()) {
          location.href = '/login?next=' + encodeURIComponent(location.pathname);
          return false;
        }
        return true;
      },
      async fetch(path, opts = {}) {
        const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
        const t = this.token();
        if (t) headers['Authorization'] = 'Bearer ' + t;
        const r = await fetch(path, Object.assign({}, opts, { headers }));
        if (r.status === 401) {
          this.clear();
          location.href = '/login?next=' + encodeURIComponent(location.pathname);
          throw new Error('unauthorized');
        }
        return r;
      },
      async json(path, opts = {}) {
        const r = await this.fetch(path, opts);
        const text = await r.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        if (!r.ok) throw Object.assign(new Error('http ' + r.status), { status: r.status, data });
        return data;
      },
    };
    // 役割表示用
    const ROLE_LABEL = { admin: '管理者', hr: '人事', manager: 'マネージャ', member: 'メンバ' };
    function roleLabel(r) { return ROLE_LABEL[r] || r || ''; }
    // 申請ステータス表示用
    const APP_STATUS_LABEL = {
      awaiting_approval: '承認待ち',
      approved: '承認済み',
      rejected: '却下',
      draft: '下書き',
      cancelled: '取消',
    };
    function appStatusLabel(s) { return APP_STATUS_LABEL[s] || s || ''; }
    // バッチジョブステータス表示用
    const BATCH_STATUS_LABEL = {
      success: '成功',
      running: '実行中',
      failed: '失敗',
      pending: '待機中',
    };
    function batchStatusLabel(s) { return BATCH_STATUS_LABEL[s] || s || ''; }
    function fmt(dt) { return dt ? String(dt).replace('T', ' ').slice(0, 16) : ''; }
  </script>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
{% block nav %}
<header class="bg-white border-b border-gray-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-6"
       x-data="navHeader()" x-init="init()">
    <a href="/app/dashboard" class="font-bold text-lg text-blue-700">open-karte</a>
    <nav class="hidden md:flex items-center gap-1 text-sm">
      <a href="/app/dashboard" class="px-3 py-1.5 rounded hover:bg-gray-100"
         :class="page==='dashboard' && 'bg-blue-50 text-blue-700 font-semibold'">ダッシュボード</a>
      <a href="/app/applications" class="px-3 py-1.5 rounded hover:bg-gray-100"
         :class="page==='applications' && 'bg-blue-50 text-blue-700 font-semibold'">申請</a>
      <a href="/app/inbox" class="px-3 py-1.5 rounded hover:bg-gray-100"
         :class="page==='inbox' && 'bg-blue-50 text-blue-700 font-semibold'">受信箱
         <span x-show="inboxCount > 0" x-cloak
               class="ml-1 inline-flex items-center justify-center w-5 h-5 text-xs rounded-full bg-red-500 text-white"
               x-text="inboxCount"></span>
      </a>
      <a href="/app/knowledge" class="px-3 py-1.5 rounded hover:bg-gray-100"
         :class="page==='knowledge' && 'bg-blue-50 text-blue-700 font-semibold'">ナレッジ</a>
    </nav>
    <div class="ml-auto flex items-center gap-3 text-sm">
      <template x-if="me">
        <span class="text-gray-600">
          <span class="font-medium text-gray-900" x-text="me.name"></span>
          <span class="ml-1 text-xs text-gray-500" x-text="'（'+roleLabel(me.role)+'）'"></span>
        </span>
      </template>
      <button @click="logout()" class="px-3 py-1.5 rounded border border-gray-300 hover:bg-gray-100">ログアウト</button>
    </div>
  </div>
</header>
<script>
function navHeader() {
  return {
    me: null,
    inboxCount: 0,
    page: '{{ active_page|default("") }}' || (location.pathname.split('/')[2] || 'dashboard'),
    async init() {
      if (!Auth.requireAuth()) return;
      this.me = Auth.me();
      try {
        // /me を取って表示更新（キャッシュも更新）
        const m = await Auth.json('/me');
        this.me = m; Auth.setMe(m);
      } catch {}
      try {
        const inbox = await Auth.json('/applications/inbox');
        this.inboxCount = (inbox || []).length;
      } catch {}
    },
    logout() { Auth.clear(); location.href = '/login'; },
    roleLabel,
  };
}
</script>
{% endblock %}
<main class="max-w-6xl mx-auto px-4 py-6">
  {% block content %}{% endblock %}
</main>
</body>
</html>
