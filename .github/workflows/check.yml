name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # verify-seed・ルート登録/認可/境界の検査・build:types・tsc を含む
      - name: api check
        run: bun run check
        working-directory: api

      - name: Core route isolation
        run: bun run verify:core-route-isolation
        working-directory: api

      - name: Core Worker isolation
        run: bun run verify:core-worker-isolation
        working-directory: api

      - name: Business context removal
        run: bun run verify:business-context-removal room knowledge onboarding
        working-directory: api

      - name: cli test
        run: bun test
        working-directory: cli

      - name: mcp check
        run: bun run check
        working-directory: mcp

      - name: mcp test
        run: bun test
        working-directory: mcp

      # api check の build:types が生成した型への web の追従を確認する
      - name: web typecheck
        run: bunx tsc --noEmit
        working-directory: web

  api-test:
    name: api test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: api test
        run: bun test --shard=${{ matrix.shard }}/4
        working-directory: api
