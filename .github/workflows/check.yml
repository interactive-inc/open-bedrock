name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # verify-seed・ルート登録/認可/境界の検査・build:types・tsc を含む
      - name: api check
        run: bun run check
        working-directory: api

      # 大容量ストレステスト（audit の >2MB/16MiB 系）が GitHub ランナーの速度では
      # 既定 5 秒を超えるため、CI ではタイムアウトを引き上げる
      - name: api test
        run: bun test --timeout 60000
        working-directory: api

      - name: cli test
        run: bun test
        working-directory: cli

      # api check の build:types が生成した型への web の追従を確認する
      - name: web typecheck
        run: bunx tsc --noEmit
        working-directory: web
