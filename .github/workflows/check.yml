name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # verify-seed・ルート登録/認可/境界の検査・build:types・tsc を含む
      - name: api check
        run: bun run check
        working-directory: api

      - name: api test
        run: bun test
        working-directory: api

      - name: cli test
        run: bun test
        working-directory: cli

      # mcp の tsc --noEmit は MCP SDK と zod の型展開が深すぎて OOM するため
      # 実行しない（追跡 Issue あり）。テストのみ回す
      - name: mcp test
        run: bun test
        working-directory: mcp

      # api check の build:types が生成した型への web の追従を確認する
      - name: web typecheck
        run: bunx tsc --noEmit
        working-directory: web
